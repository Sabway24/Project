<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - EcoTrackBin</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
<header>
    <img src="logo.png" alt="EcoTrackBin" class="logo" style="width: 150px; height: auto; margin-top: -3.5%;">
  <nav class="nav-links" style ="margin-top: -3.5%;">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT US</a>
    <a href="dashboard.html">DASHBOARD</a>
    <a href="team.html">OUR TEAM</a>
  </nav>
</header>

<section class="section" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 0;">
    <h3 style="margin-bottom: -50px;">Dashboard</h3></section>

  <section class="section dashboard">
  <div class="card">
    <h2 style="font-family: monospace; font-size: 21px; color: #1a4d2e;">FILL LEVEL</h2>
    <p style="font-family: monospace; font-size: 19px;">Status: Bin is 25%</p>
    <canvas id="fillChart" width="200" height="200"></canvas>
    <p style="font-family: monospace; font-size: 19px;">Filled: 25%<br>Empty: 75%</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById('fillChart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Filled', 'Empty'],
      datasets: [{
        label: 'Fill Level',
        data: [25, 75],
        backgroundColor: ['#004d1a', '#99ffcc'],
        borderWidth: 0
      }]
    },
    options: {
      cutout: '70%',
      plugins: {
        legend: {
          display: false
        }
      }
    }
  });
</script>

<div class="card2">
  <h2 style="font-family: monospace; font-size: 21px; color: #1a4d2e;">BIN LOCATION</h2><br>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3978.146642134375!2d100.96863357454195!3d4.383627595590503!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31cade1d71cde0ef%3A0x971b7645a0288e21!2sUniversiti%20Teknologi%20PETRONAS!5e0!3m2!1sen!2smy!4v1751724458884!5m2!1sen!2smy"
   width="500;" height="370;" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
</section>
  
<footer>
  &copy; Group 28 EcoTrackBin UNIVERSITI TEKNOLOGI PETRONAS
</footer>

</body>
</html>
